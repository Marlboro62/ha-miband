name: Validation

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          ignore: brands description topics

  tests:
    name: Tests du protocole
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pytest cryptography
      - run: pytest -q tests

  ha-import:
    name: Import dans Home Assistant
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install homeassistant
      - name: Installer les dépendances des composants Bluetooth de HA
        run: |
          python - <<'PY' > reqs.txt
          import json, pathlib, homeassistant
          base = pathlib.Path(homeassistant.__file__).parent / "components"
          for comp in ("bluetooth", "bluetooth_adapters", "usb", "http", "frontend"):
              manifest = base / comp / "manifest.json"
              if manifest.exists():
                  for req in json.loads(manifest.read_text()).get("requirements", []):
                      print(req)
          PY
          cat reqs.txt
          pip install -r reqs.txt
      - name: Importer tous les modules de l'intégration
        run: |
          pip show homeassistant | head -2
          python - <<'PY'
          import importlib, sys, traceback
          failed = False
          for mod in ("", ".config_flow", ".coordinator", ".sensor", ".binary_sensor", ".button", ".zepp_cloud"):
              name = "custom_components.miband" + mod
              try:
                  importlib.import_module(name)
                  print("ok", name)
              except Exception:
                  failed = True
                  tb = traceback.format_exc().strip().replace("\n", "%0A")
                  print(f"::error title=Import {name}::{tb}")
          sys.exit(1 if failed else 0)
          PY
